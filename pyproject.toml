[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tidy-tir"
version = "1.1.0"
description = "Standalone thermal infrared image denoising inference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "Pillow>=10,<13",
    "torch>=2.7,<2.12",
]

[project.scripts]
tidy = "tidy.cli:main"
tidy-deploy = "tidy.deployment:main"

[project.optional-dependencies]
accelerated = [
    "onnx==1.18.0",
    "onnxruntime-gpu==1.22.0",
    "tensorrt-cu12==10.9.0.34; platform_system == 'Linux' and platform_machine == 'x86_64'",
]

[tool.setuptools.packages.find]
include = ["tidy*"]
