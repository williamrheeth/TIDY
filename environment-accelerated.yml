name: tidy-accelerated
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip>=24
  - setuptools>=68
  - numpy=2.2.6
  - pillow=11.3.0
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.9.1+cu128
      - onnx==1.18.0
      - onnxruntime-gpu==1.22.0
      - tensorrt-cu12==10.9.0.34
      - -e .
